name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create project files
        run: |
          mkdir -p app/src/main/java/com/example/netwidget
          mkdir -p app/src/main/res/drawable app/src/main/res/values

          echo "" | base64 -d > app/debug.keystore

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.example.netwidget'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.netwidget"
                  minSdk 30
                  targetSdk 34
                  versionCode 100 + Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
                  versionName "4.0"
              }
              signingConfigs {
                  debug {
                      storeFile file('debug.keystore')
